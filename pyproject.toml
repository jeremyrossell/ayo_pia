[project]
name = "ayo-pia"
version = "0.1.0"
description = "Final project of our Algorithms & Optimization class"
readme = "README.md"
authors = [
    { name = "Jeremy Rossell", email = "114305494+jeremyrossell@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
]

[project.scripts]
ayo-pia = "ayo_pia:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
